 show organized by my friend, the owner of Rhizome &amp; Reason, to bring together local plant enthusiasts, collectors, growers, and small businesses. Vendors showcase rare and unusual plants and products in a welcoming community setting.</p><p>My role focuses on the event’s marketing and digital work. I create social media content, promote vendors and updates, develop and maintain the event website, coordinate with vendors, and handle technical details behind the scenes.</p></section><div class="detail-tags"><span>Website</span><span>Product listings</span><span>Plant shows</span><span>Digital media</span></div></div></div></template></article>
      <article class="gallery-entry" id="plant-culture"><button class="gallery-card" type="button" data-gallery-trigger aria-label="Open Plant Tissue Culture details"><span class="experience-pixel-art" role="img" aria-label="Pixel art plant in lab jar"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="7" width="18" height="5" fill="#c5e8f5"/><rect x="12" y="12" width="24" height="28" fill="#b7dfe5"/><rect x="16" y="17" width="16" height="19" fill="#e9f5e4"/><rect x="22" y="20" width="4" height="14" fill="#79aa74"/><rect x="15" y="22" width="10" height="6" fill="#93c78a"/><rect x="24" y="16" width="11" height="7" fill="#79aa74"/><rect x="17" y="36" width="13" height="3" fill="#b99569"/></svg></span><span class="project-type">INDEPENDENT BUSINESS</span><strong>Plant Tissue Culture</strong><span class="gallery-summary">Home tissue-culture lab focused on micropropagating rare and variegated tropical aroids.</span><span class="experience-role">Owner · Apr 2026–Present</span><span class="gallery-card-open">OPEN EXPERIENCE <b aria-hidden="true">↗</b></span></button><template class="gallery-detail"><div class="gallery-modal-layout"><div class="gallery-modal-image gallery-image-placeholder" role="img" aria-label="Plant Tissue Culture image placeholder"><b aria-hidden="true">▧</b><small>ADD YOUR IMAGE</small></div><div><p class="project-type">INDEPENDENT BUSINESS</p><h2>Plant Tissue Culture</h2><p class="experience-modal-role">Owner · Apr 2026–Present</p><p>I’m a small business owner and plant tissue-culture enthusiast who built a tissue-culture lab in my home. My work specializes in the micropropagation of rare and variegated tropical aroids, including Monstera, Philodendron, Alocasia, and Anthurium.<br><br>My interest in tissue culture started when I learned it was possible to clone and propagate plants in vitro. Since then, I’ve spent countless hours learning sterile technique, experimenting with media formulations, and developing cultures from rare specimens.<br><br>I’ve also partnered with Lilian Chan, the owner of Rhizome &amp; Reason and a local rare Alocasia collector and vendor, to attend local plant shows and share tissue-cultured plants with the broader plant community. Collaborating with experienced collectors and growers has helped me learn how to start my own business and connect with customers.</p><div class="detail-tags"><span>Tissue culture</span><span>Sterile technique</span><span>Small business</span></div></div></div></template></article>
